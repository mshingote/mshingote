name: Update Spotify Now Playing

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: spotify-now-playing
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate Spotify card
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/update_spotify.py
      - name: Commit card if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- assets/spotify.svg; then
            exit 0
          fi

          # GitHub caches README images aggressively. Change the image URL whenever
          # the card changes so the profile fetches the newly generated SVG.
          CACHE_KEY="$(date +%s)"
          python - "$CACHE_KEY" <<'PY'
          import re
          import sys

          path = "README.md"
          cache_key = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          url = "https://raw.githubusercontent.com/mshingote/mshingote/main/assets/spotify.svg"
          pattern = re.escape(url) + r"(?:\\?v=[^)]*)?"
          replacement = f"{url}?v={cache_key}"
          text, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f"Expected one Spotify card URL in README, found {count}")
          open(path, "w", encoding="utf-8").write(text)
          PY

          git add assets/spotify.svg README.md
          git commit -m "chore: update Spotify now playing"
          git pull --rebase origin main
          git push origin main
